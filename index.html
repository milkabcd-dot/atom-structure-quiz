body{background:linear-gradient(160deg,#dbeafe,#f5d0fe 55%,#fed7aa) fixed}
h1{background:linear-gradient(100deg,#4f46e5,#c026d3 55%,#ea580c);color:#fff;border-radius:20px;padding:18px 20px;margin:8px 0 12px;box-shadow:0 6px 0 rgba(79,70,229,.35)}
.sub{font-weight:600}

.big{background:linear-gradient(100deg,#4f46e5,#db2777,#ea580c);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:84px}
.c.st{background:#db2777;border-color:#db2777;color:#fff}

.note{background:var(--sc,var(--acc));color:#fff}

</style>
</head>

["מה ניתן לומר על יסודות השייכים לאותה משפחה כימית?",["יש להם תכונות כימיות דומות","הם יכולים ליצור קשר רק בינם לבין עצמם","לכולם אותו מספר אלקטרונים באטומים","לכולם אותו מספר פרוטונים באטומים"],0],
["היסודות בטבלה המחזורית מסודרים לפי…",["שמות היסודות בלועזית","הסדר שבו התגלו","מספר אטומי עולה","מספר אלקטרונים ברמה הגבוהה ביותר"],2],
["צזיום, בסמל Cs, נמצא באזור השמאלי של הטבלה המחזורית. מה ניתן ללמוד מכך?",["צזיום הוא אל מתכת","צזיום מוליך חשמל","לצזיום אין ברק מתכתי","צזיום נמצא במצב צבירה גז בטמפרטורת החדר"],1],
["יסודות הבנויים מאטומים בודדים ולא נוטים להתרכב בקלות.",FAM,2],
["משפחה הכוללת בין השאר את היסודות אשלגן, נתרן וליתיום.",FAM,0],
["כולם מצויים במצב צבירה גזי בטמפרטורת החדר.",FAM,2],
["בעת מעבר זרם חשמלי דרכם נפלט אור בצבעים שונים, תלוי ביסוד.",FAM,2],
["יוצרים תרכובות עם מתכות.",FAM,1],
["יסודות המופיעים בטור הראשון (מצד שמאל) של טבלת היסודות.",FAM,0],
["משפחה הכוללת בין השאר את היסודות הליום, ניאון וארגון.",FAM,2],
["יסודות המופיעים בטור השביעי של טבלת היסודות.",FAM,1],
["יסודות המוליכים זרם חשמלי.",FAM,0],
["יסודות המופיעים בטור השמיני (הימני ביותר) של טבלת היסודות.",FAM,2],
["יסודות שאינם נוטים ליצור תרכובות עם יסודות אחרים.",FAM,2],
["יסודות מוצקים בטמפרטורת החדר.",FAM,0],
["משפחה הכוללת את היסודות פלואור, כלור, יוד, ברום ואסטטין.",FAM,1]
];
const SY="H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og".split(" "),ST=new Set("B Si Ge As Sb Te Po At".split(" "));
function pos(n){if(n==1)return[1,1];if(n==2)return[1,18];if(n<=4)return[2,n-2];if(n<=10)return[2,n+8];if(n<=12)return[3,n-10];if(n<=18)return[3,n];if(n<=36)return[4,n-18];if(n<=54)return[5,n-36];if(n<=56)return[6,n-54];if(n<=71)return[9,n-54];if(n<=86)return[6,n-68];if(n<=88)return[7,n-86];if(n<=103)return[10,n-86];return[7,n-100]}
const TBL='<div class="ptw" dir="ltr"><div class="pt">'+SY.map((s,k)=>{const n=k+1,p=pos(n);return `<div class="c${ST.has(s)?" st":""}" style="grid-row:${p[0]};grid-column:${p[1]}"><small>${n}</small>${s}</div>`}).join("")+'</div></div><p class="cap">הטבלה המחזורית. היסודות הצבועים נמצאים על קו המדרגות: מתכות משמאל לקו, אל מתכות מימינו.</p>';
const TBL2=TBL.replace('<div class="pt">','<div class="hd">'+[1,2,13,14,15,16,17,18].map((c,k)=>`<span style="grid-column:${c}">${k+1}</span>`).join("")+'</div><div class="pt">').replace('</p>',' המספרים מעל הטבלה הם מספרי הטורים (1–8).</p>');
const L=["א","ב","ג","ד","ה"],A=document.getElementById("app"),C=2*Math.PI*28;
let i=0,score=0,miss=[];
function sec(n){let s=S[0][0];for(const x of S)if(n>=x[1])s=x[0];return s}
function show(){
 const q=Q[i],off=C*(1-i/Q.length);A.style.setProperty("--sc",["#0284c7","#7c3aed","#db2777","#d97706","#059669","#e11d48","#4f46e5"][S.findLastIndex(x=>i>=x[1])]);
 A.innerHTML=`<div class="top"><div class="ring"><svg viewBox="0 0 64 64"><circle class="t" cx="32" cy="32" r="28"/><circle class="p" cx="32" cy="32" r="28" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><b>${i+1}</b></div><div><div class="sec">${sec(i)}</div><div class="cnt">שאלה ${i+1} מתוך ${Q.length} · ציון נוכחי: ${score}</div></div></div>
 <div class="q">${q[0]}</div>${i>=3&&i<=6?TBL:i>=26&&i<=30?'<p class="note">שימו לב ❤ כל השאלות ברצף 27–31 מתייחסות לאותו יסוד.</p>'+TBL:i==46||i==48||i==50?TBL2:""}<div class="opts">${q[1].map((o,k)=>`<button class="o" data-k="${k}"><i>${L[k]}</i><span>${o}</span></button>`).join("")}</div><div class="fb" aria-live="polite"></div><button class="btn hid" id="nx">${i<Q.length-1?"לשאלה הבאה":"לתוצאות"}</button>`;
 A.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 document.getElementById("nx").onclick=()=>{i++;i<Q.length?show():end()};
}
function pick(k){
 const q=Q[i],bs=A.querySelectorAll(".o"),fb=A.querySelector(".fb");
 bs.forEach((b,j)=>{b.disabled=true;if(j===q[2]){b.classList.add("ok");b.firstChild.textContent="✓"}});
 if(k===q[2]){score++;fb.style.color="var(--ok)";fb.textContent="נכון, כל הכבוד!"}
 else{bs[k].classList.add("no");bs[k].firstChild.textContent="✗";miss.push(i);fb.style.color="var(--bad)";fb.textContent="לא נכון. התשובה הנכונה מסומנת בירוק."}
 const n=document.getElementById("nx");n.classList.remove("hid");n.focus();
}
function end(){
 const p=Math.round(score/Q.length*100);
 const msg=p>=90?"מצוין! שליטה מלאה בחומר.":p>=70?"יפה מאוד! עוד קצת תרגול ותגיעו למצוין.":p>=50?"התחלה טובה. כדאי לחזור על הטעויות.":"כדאי לחזור על החומר ולנסות שוב.";
 A.innerHTML=`<div class="sec">סיום החידון</div><div class="big">${p}</div><div class="q">ענית נכון על ${score} מתוך ${Q.length} שאלות. ${msg}</div>
 ${miss.length?`<div class="sec">תיקון הטעויות</div><ul class="rev">${miss.map(n=>`<li>${n+1}. ${Q[n][0]}<br><b>התשובה הנכונה: ${Q[n][1][Q[n][2]]}</b></li>`).join("")}</ul>`:""}
 <button class="btn" id="rs">נסו שוב</button>`;
 document.getElementById("rs").onclick=()=>{i=0;score=0;miss=[];show()};
}
show();
</script>
